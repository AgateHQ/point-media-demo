# fly.toml app configuration file generated for point-beta on 2026-11-04T08:00:07Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'point-beta'
primary_region = 'lhr'
kill_signal = 'SIGTERM'
kill_timeout = '30s'

[build]
  dockerfile = 'Dockerfile'

[env]
  DATABASE_URL = 'file:/data/payload.db'
  HOSTNAME = '0.0.0.0'
  MEDIA_DIR = '/data/media'
  NODE_ENV = 'production'
  PORT = '3000'

[[mounts]]
  source = 'point_media_data'
  destination = '/data'
  initial_size = '3GB'
  snapshot_retention = 14

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '10s'
    grace_period = '1m0s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
